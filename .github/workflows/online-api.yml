name: ONLINE-01B — API PostgreSQL isolada
on:
  pull_request:
    branches: [main]
    paths:
      - 'services/api/**'
      - 'packages/game-core/src/**'
      - 'scripts/build-api-game-core.mjs'
      - '.github/workflows/online-api.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  api-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: kanto_ci
          POSTGRES_PASSWORD: ci_only_not_production
          POSTGRES_DB: kanto_ci
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U kanto_ci -d kanto_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://kanto_ci:ci_only_not_production@127.0.0.1:55432/kanto_ci
      APP_ORIGIN: http://127.0.0.1:43142
      ONLINE_REGISTRATION_ENABLED: 'true'
      NODE_ENV: test
      AUTH_RATE_LIMIT_SECRET: 'ci-only-security-pepper-never-used-in-railway-2026'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check committed lock with clean npm install
        run: npm ci --prefix services/api --ignore-scripts --no-audit --no-fund
      - name: Build private game-core adapter from monorepo lock
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node scripts/build-api-game-core.mjs "$RUNNER_TEMP/frozenBattle.mjs"
          echo "CORE_BUNDLE_PATH=$RUNNER_TEMP/frozenBattle.mjs" >> "$GITHUB_ENV"
          CORE_BUNDLE_PATH="$RUNNER_TEMP/frozenBattle.mjs" node --input-type=module -e '
            const m=await import(process.env.CORE_BUNDLE_PATH);
            if(typeof m.previewFrozenWildBattle!=="function"||typeof m.quoteFrozenBattleRewards!=="function"||typeof m.applyFrozenBattleRewardQuote!=="function"||typeof m.finalizeFrozenWildEncounter!=="function"||typeof m.createFrozenWildTurnSession!=="function"||typeof m.initialFrozenWildTurnActions!=="function"||typeof m.resolveFrozenWildTurn!=="function"||typeof m.legalFrozenWildTurnActions!=="function")process.exit(1)
          '
      - name: Validate npm lock & code
        run: |
          npm run check --prefix services/api
          npm run test --prefix services/api
      - name: Apply and replay transactional migration
        run: |
          npm run db:migrate --prefix services/api
          npm run db:migrate --prefix services/api
      - name: HTTP authentication and save isolation
        run: npm run test:integration --prefix services/api
      - name: Disaster recovery drill on disposable PostgreSQL (never production)
        run: |
          set -euo pipefail
          pg() {
            docker run --rm --network host -e PGPASSWORD=ci_only_not_production \
              postgres:18-alpine "$@"
          }
          pg pg_dump -h 127.0.0.1 -p 55432 -U kanto_ci -d kanto_ci -Fc \
            > "$RUNNER_TEMP/kanto-ci.dump"
          test -s "$RUNNER_TEMP/kanto-ci.dump"
          pg psql -h 127.0.0.1 -p 55432 -U kanto_ci -d postgres \
            -v ON_ERROR_STOP=1 -c 'CREATE DATABASE kanto_ci_restore'
          docker run --rm -i --network host -e PGPASSWORD=ci_only_not_production \
            postgres:18-alpine pg_restore -h 127.0.0.1 -p 55432 \
              -U kanto_ci -d kanto_ci_restore --no-owner --no-acl \
            < "$RUNNER_TEMP/kanto-ci.dump"
          versions=$(pg psql -At -h 127.0.0.1 -p 55432 -U kanto_ci \
            -d kanto_ci_restore -c 'SELECT count(*) FROM game_schema_migrations')
          test "$versions" = 15
          saves=$(pg psql -At -h 127.0.0.1 -p 55432 -U kanto_ci \
            -d kanto_ci_restore -c 'SELECT count(*) FROM game_saves')
          test "$saves" -ge 2
          receipts=$(pg psql -At -h 127.0.0.1 -p 55432 -U kanto_ci \
            -d kanto_ci_restore -c 'SELECT count(*) FROM game_action_receipts')
          test "$receipts" -ge 2
          echo "ONLINE01C3_RESTORE_DRILL_OK: isolated PG18 backup/restore"
          rm -f "$RUNNER_TEMP/kanto-ci.dump"
      - name: Build separate API image and verify isolation
        run: |
          docker build -f services/api/Dockerfile -t kanto-online-api .
          docker run --rm --entrypoint sh kanto-online-api -c '
            set -eu
            test "$(id -un)" = node
            test -e /srv/api/src/server.mjs
            test -e /srv/api/sql/001_online_foundation.sql
            test -s /srv/api/game-core/frozenBattle.mjs
            test ! -e /srv/api/apps
            test ! -e /srv/api/landing.html
            test ! -e /srv/api/assets
            test ! -e /srv/api/.env
            test ! -e /srv/api/package-lock.json.bak
          '
          docker run --rm --entrypoint node kanto-online-api --input-type=module -e '
            const m=await import("./game-core/frozenBattle.mjs");
            if(typeof m.previewFrozenWildBattle!=="function")process.exit(1)
          '
