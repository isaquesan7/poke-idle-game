name: Foundation v0.2 — Core TypeScript

on:
  push:
    branches:
      - refactor/foundation-v0.2
  workflow_dispatch:

permissions:
  contents: write

jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Gerar lockfile e instalar dependências reproduzíveis
        run: |
          npm install --package-lock-only --ignore-scripts
          npm ci
      - name: Validar TypeScript e regras de jogo
        run: |
          npm run typecheck:core
          npm run test:core
          npm test
          npm run verify:gifs
      - name: Registrar lockfile somente após testes aprovados na branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile já está sincronizado"
            exit 0
          fi
          git commit -m "chore: fixar dependências do game-core v0.2"
          git push origin HEAD:refactor/foundation-v0.2
