name: D-043 lockfile verificado (temporário)

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/web/package.json'
      - 'packages/game-core/package.json'
      - '.github/workflows/d043-lockfile-resolve.yml'
  workflow_dispatch:

# D-043 SOMENTE em PR próprio de dependências. Arquivo será excluído da
# branch ANTES do merge: jamais deixar workflow de PR com permissão write
# na main. Não executar scripts não confiáveis para criar o lockfile.
permissions:
  contents: write

jobs:
  resolve-lock:
    if: github.event_name == 'pull_request' && github.head_ref == 'chore/v02-d043-vitest-security-upgrade' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/v02-d043-vitest-security-upgrade
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Resolver somente lockfile, sem script de instalação
        shell: bash
        run: |
          set -eu
          # npm 10.9.9 (Node 22 runner) pode lançar edgesOut:null ao reconciliar
          # lockfile antigo com a major Vitest 4; usar npm 11 para atualização.
          npm install --global npm@11
          npm --version
          if ! npm install --package-lock-only --ignore-scripts --no-audit --no-fund; then
            echo "Falhou atualização incremental do lock; regenerando com npm 11."
            cp package-lock.json /tmp/d043-lock-original.json
            rm package-lock.json
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          fi
          test -s package-lock.json
      - name: Instalação integral reproduzível
        run: npm ci
      - name: Auditar versões realmente resolvidas (não auto-fix)
        shell: bash
        run: |
          npm ls vitest vite tinypool @vitest/mocker picomatch || true
          npm audit --json > audit-all.json || true
          npm audit --omit=dev --json > audit-prod.json || true
          node scripts/report-npm-audit.mjs audit-all.json audit-prod.json
          cat audit-summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Guardar snapshot da auditoria
        uses: actions/upload-artifact@v4
        with:
          name: d043-security-audit
          path: |
            audit-all.json
            audit-prod.json
            audit-summary.md
            package-lock.json
      - name: Registrar SOMENTE package-lock.json no branch de trabalho
        shell: bash
        run: |
          set -eu
          git add -- package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile já sincronizado; sem alterações."
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "chore(lock): resolver Vitest 4.1.12 no npm lockfile"
          git push origin HEAD:chore/v02-d043-vitest-security-upgrade
