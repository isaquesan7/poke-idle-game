name: React Trainer + Overview — paridade v0.1

on:
  push:
    branches:
      - feat/react-trainer-overview-v02
  workflow_dispatch:

permissions:
  contents: write

jobs:
  parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Atualizar lockfile na branch e instalar workspaces
        run: |
          npm install --package-lock-only --ignore-scripts
          npm ci
      - name: Verificar tipos, paridade, build, servidor e assets
        run: |
          npm run typecheck:core
          npm run test:core
          npm run typecheck:web
          npm run test:web
          npm run build:web
          npm test
          npm run verify:gifs
      - name: Instalar Chromium no runner compatível
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Regressão de save e jogo v0.1 no navegador
        run: node tests/e2e/browser-smoke.mjs
      - name: Regressão das telas React (desktop e mobile)
        run: node apps/web/tests/e2e/react-preview.mjs
      - name: Anexar capturas para revisão
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trainer-overview-parity-screenshots
          path: |
            artifacts/react-preview/*.png
            artifacts/browser/*.png
          if-no-files-found: ignore
      - name: Fixar lockfile somente nesta branch (após CI verde)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile atualizado"
            exit 0
          fi
          git commit -m "chore: atualizar lockfile do dashboard/treinador v0.2"
          git push origin HEAD:feat/react-trainer-overview-v02
