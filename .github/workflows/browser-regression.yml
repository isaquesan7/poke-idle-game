name: Regressão Chromium (desktop, mobile e save v0.1)

on:
  push:
    branches:
      - feat/kanto-animated-gifs-v01
    paths:
      - .github/workflows/browser-regression.yml
      - tests/e2e/**
      - tests/fixtures/**
      - scripts/pokemon-sprites.js
      - server.mjs
      - index.html
      - styles/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar regras e GIFs
        run: |
          npm test
          npm run verify:gifs
      - name: Instalar Playwright no CI
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Testar navegador desktop/mobile, GIFs e saves
        run: node tests/e2e/browser-smoke.mjs
      - name: Anexar capturas para revisão visual
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: poke-regression-screenshots
          path: artifacts/browser/*.png
          if-no-files-found: ignore
