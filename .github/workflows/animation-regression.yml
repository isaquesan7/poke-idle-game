name: Regressão Playwright isolada — Arena e jornadas completas

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/web/src/play/**'
      - 'apps/web/package.json'
      - 'packages/game-core/package.json'
      - 'package-lock.json'
      - 'apps/web/tests/e2e/playable-route.mjs'
      - 'styles/**'
      - '.github/workflows/animation-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-motion:
    # Navegador + bibliotecas prontas na imagem oficial: evita que a
    # validação CSS/GIF dependa de apt-get --with-deps em todo PR.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --init
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Dependências reproduzíveis
        run: npm ci
      - name: Sintaxe do teste de navegador
        run: node --check apps/web/tests/e2e/playable-route.mjs
      - name: Build da rota jogável
        run: npm run build:web
      - name: Test runner na mesma versão do Chromium container
        run: |
          npm install --global npm@11
          npm install --no-save --package-lock=false playwright@1.56.1
      - name: Domínio, storage, testes Node e 151 GIFs
        run: |
          npm run typecheck:core
          npm run test:core
          npm run typecheck:web
          npm run test:web
          npm test
          npm run verify:gifs
      - name: E2E do jogo v0.1
        run: node tests/e2e/browser-smoke.mjs
      - name: E2E da prévia React
        run: node apps/web/tests/e2e/react-preview.mjs
      - name: E2E do rascunho v0.2
        run: node apps/web/tests/e2e/draft-preview.mjs
      - name: E2E do sandbox de migração (origem de teste)
        run: node apps/web/tests/e2e/browser-cutover-lab.mjs
      - name: GIF estável, combate/replay e reduced-motion desktop/mobile
        run: node apps/web/tests/e2e/playable-route.mjs
      - name: Capturas para revisão visual
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arena-motion-screenshots
          path: |
            artifacts/browser/*.png
            artifacts/react-preview/*.png
            artifacts/draft-preview/*.png
            artifacts/playable/*.png
          if-no-files-found: ignore
